{% extends "slurp_ui/base_module.html" %}
{% block title %}Payment Entry — SLURP{% endblock %}
{% block module_title %}Finance{% endblock %}
{% block main %}
<h2>Record payment</h2>
<form method="post">{% csrf_token %}
  <label>Type
    <select name="payment_type">
      <option value="ar_payment" {% if payment_type == "ar_payment" %}selected{% endif %}>AR (customer)</option>
      <option value="ap_payment" {% if payment_type == "ap_payment" %}selected{% endif %}>AP (vendor)</option>
    </select>
  </label>
  <label>Date<input type="date" name="payment_date" required /></label>
  <label>Method<input name="payment_method" value="check" /></label>
  <label>Amount<input type="number" step="0.01" name="amount" required /></label>
  <label>Cash account
    <select name="account"><option value="">—</option>{% for a in cash_accounts %}<option value="{{ a.id }}">{{ a.account_number }} — {{ a.name }}</option>{% endfor %}</select>
  </label>
  <label>AR entry
    <select name="ar_entry"><option value="">—</option>{% for r in open_ar %}<option value="{{ r.id }}" {% if ar_entry_id == r.id|stringformat:"s" %}selected{% endif %}>{{ r.customer_name }} — {{ r.balance|money:2 }}</option>{% endfor %}</select>
  </label>
  <label>AP entry
    <select name="ap_entry"><option value="">—</option>{% for r in open_ap %}<option value="{{ r.id }}" {% if ap_entry_id == r.id|stringformat:"s" %}selected{% endif %}>{{ r.vendor_name }} — {{ r.balance|money:2 }}</option>{% endfor %}</select>
  </label>
  <label>Reference<input name="reference_number" /></label>
  <label>Notes<textarea name="notes"></textarea></label>
  <button class="hs-btn hs-btn-primary" type="submit">Save payment</button>
</form>
{% endblock %}
