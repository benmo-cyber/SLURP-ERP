{% extends "slurp_ui/base_module.html" %}
{% block title %}Create Invoice — SLURP{% endblock %}
{% block module_title %}Finance{% endblock %}
{% block main %}
<h2>Manual invoice</h2>
<form method="post">{% csrf_token %}
  {% if form_fields %}{{ form_fields|safe }}{% endif %}
  <label>Sales order<select name="sales_order">{% for so in sales_orders %}<option value="{{ so.id }}">{{ so.so_number }}</option>{% endfor %}</select></label>
  <label>Customer<input name="customer_name" /></label>
  <label>Invoice date<input type="date" name="invoice_date" /></label>
  <button class="hs-btn hs-btn-primary" type="submit">Create</button>
  <a class="hs-btn" href="{% url 'slurp_ui:finance_invoices' %}">Cancel</a>
</form>
{% endblock %}
