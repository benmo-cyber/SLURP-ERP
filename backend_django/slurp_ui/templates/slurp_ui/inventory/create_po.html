{% extends "slurp_ui/base.html" %}
{% block title %}Create PO — SLURP{% endblock %}
{% block content %}
<div class="modal-page" style="max-width:960px">
  <h2>Create Purchase Order</h2>
  <form method="post" id="create-po-form">
    {% csrf_token %}
    <div class="form-row">
      <label for="vendor_id">Vendor *</label>
      <select id="vendor_id" name="vendor_id" required>
        <option value="">— Select vendor —</option>
        {% for v in vendors %}
        <option value="{{ v.id }}">{{ v.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
      <div class="form-row">
        <label for="required_date">Required date</label>
        <input id="required_date" name="required_date" type="date" />
      </div>
      {% if god_mode %}
      <div class="form-row">
        <label for="order_date">Order / issue date (God mode)</label>
        <input id="order_date" name="order_date" type="date" value="{{ today }}" />
      </div>
      {% endif %}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
      <div class="form-row">
        <label for="shipping_terms">Shipping terms</label>
        <input id="shipping_terms" name="shipping_terms" />
      </div>
      <div class="form-row">
        <label for="shipping_method">Shipping method</label>
        <input id="shipping_method" name="shipping_method" />
      </div>
    </div>
    <div class="form-row">
      <label for="coa_sds_email">CoA / SDS email</label>
      <input id="coa_sds_email" name="coa_sds_email" type="email" placeholder="customerservice@wildwoodingredients.com" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
      <div class="form-row">
        <label for="discount">Discount</label>
        <input id="discount" name="discount" type="number" step="0.01" value="0" />
      </div>
      <div class="form-row">
        <label for="shipping_cost">Shipping cost</label>
        <input id="shipping_cost" name="shipping_cost" type="number" step="0.01" value="0" />
      </div>
    </div>
    <div class="form-row">
      <label><input type="checkbox" name="drop_ship" /> Drop ship (do not check in to inventory)</label>
    </div>
    <div class="form-row">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="2"></textarea>
    </div>

    <h3 style="margin:1.25rem 0 0.5rem">Ship to</h3>
    <div class="form-row"><label>Name</label><input name="ship_to_name" value="Wildwood Ingredients, LLC" /></div>
    <div class="form-row"><label>Address</label><input name="ship_to_address" value="6431 Michels Dr." /></div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0.5rem">
      <div class="form-row"><label>City</label><input name="ship_to_city" value="Washington" /></div>
      <div class="form-row"><label>State</label><input name="ship_to_state" value="MO" /></div>
      <div class="form-row"><label>ZIP</label><input name="ship_to_zip" value="63090" /></div>
      <div class="form-row"><label>Country</label><input name="ship_to_country" value="USA" /></div>
    </div>

    <h3 style="margin:1.25rem 0 0.5rem">Lines</h3>
    <input type="hidden" name="line_count" id="line_count" value="1" />
    <div id="po-lines">
      <div class="po-line" data-index="0" style="border:1px solid #e5e7eb;padding:0.75rem;margin-bottom:0.5rem;border-radius:6px">
        <div class="form-row">
          <label>Item *</label>
          <select name="item_id_0" required>
            <option value="">— Select item —</option>
            {% for it in items %}
            <option value="{{ it.id }}" data-uom="{{ it.unit_of_measure }}">
              {{ it.sku }} — {{ it.vendor_item_name|default:it.name }}{% if it.vendor_item_number %} ({{ it.vendor_item_number }}){% endif %}
            </option>
            {% endfor %}
          </select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem">
          <div class="form-row"><label>Qty *</label><input name="quantity_0" type="number" step="any" min="0" required /></div>
          <div class="form-row"><label>Unit cost</label><input name="unit_cost_0" type="number" step="0.01" value="0" /></div>
          <div class="form-row">
            <label>Order UoM</label>
            <select name="order_uom_0">
              <option value="">Item default</option>
              <option value="lbs">lbs</option>
              <option value="kg">kg</option>
              <option value="ea">ea</option>
            </select>
          </div>
        </div>
        <div class="form-row"><label>Line notes</label><input name="notes_0" /></div>
      </div>
    </div>
    <button type="button" class="btn btn-secondary" id="add-line">Add line</button>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create draft PO</button>
      <a class="btn btn-secondary" href="{% url 'slurp_ui:inventory_purchase_orders' %}">Cancel</a>
    </div>
  </form>
</div>
<script>
(function(){
  const holder = document.getElementById('po-lines');
  const countInput = document.getElementById('line_count');
  const first = holder.querySelector('.po-line');
  document.getElementById('add-line').addEventListener('click', function(){
    const i = holder.querySelectorAll('.po-line').length;
    const clone = first.cloneNode(true);
    clone.dataset.index = i;
    clone.querySelectorAll('[name]').forEach(function(el){
      el.name = el.name.replace(/_\d+$/, '_' + i);
      if (el.tagName === 'INPUT' && el.type !== 'hidden') el.value = el.type === 'number' && el.name.indexOf('unit_cost')>=0 ? '0' : '';
      if (el.tagName === 'SELECT') el.selectedIndex = 0;
      if (el.name.indexOf('item_id')===0 || el.name.indexOf('quantity')===0) el.required = true;
    });
    holder.appendChild(clone);
    countInput.value = String(i + 1);
  });
})();
</script>
{% endblock %}
