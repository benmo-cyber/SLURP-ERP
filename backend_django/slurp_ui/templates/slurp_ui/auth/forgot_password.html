{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SLURP — Forgot password</title>
  <link rel="stylesheet" href="{% static 'slurp_ui/css/Login.css' %}" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <h1>SLURP</h1>
        <p class="login-subtitle">Reset your password</p>
      </div>
      {% if message %}
        <div class="login-error" style="background:#d1e7dd;color:#0f5132">{{ message }}</div>
      {% endif %}
      <form method="post" class="login-form">
        {% csrf_token %}
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <button type="submit" class="login-submit">Send reset link</button>
        <p class="login-forgot"><a href="{% url 'slurp_ui:login' %}">Back to sign in</a></p>
      </form>
    </div>
  </div>
</body>
</html>
