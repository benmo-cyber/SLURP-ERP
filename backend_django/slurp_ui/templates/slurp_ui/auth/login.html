{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SLURP — Sign in</title>
  <link rel="stylesheet" href="{% static 'slurp_ui/css/Login.css' %}" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <img src="{% static 'slurp_ui/logo.png' %}" alt="Wildwood Ingredients" class="login-logo" />
        <h1>SLURP</h1>
        <p class="login-subtitle">Sign in to continue</p>
      </div>
      <form method="post" class="login-form">
        {% csrf_token %}
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-submit">Sign in</button>
        <p class="login-forgot">
          <a href="{% url 'slurp_ui:forgot_password' %}">Forgot password?</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
