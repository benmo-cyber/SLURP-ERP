{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SLURP — Reset password</title>
  <link rel="stylesheet" href="{% static 'slurp_ui/css/Login.css' %}" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <h1>SLURP</h1>
        <p class="login-subtitle">Choose a new password</p>
      </div>
      {% if invalid %}
        <div class="login-error">{{ error }}</div>
        <p class="login-forgot"><a href="{% url 'slurp_ui:forgot_password' %}">Request a new link</a></p>
      {% else %}
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
        <form method="post" class="login-form">
          {% csrf_token %}
          <div class="form-group">
            <label for="new_password">New password</label>
            <input id="new_password" name="new_password" type="password" required minlength="8" />
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" required minlength="8" />
          </div>
          <button type="submit" class="login-submit">Update password</button>
        </form>
      {% endif %}
    </div>
  </div>
</body>
</html>
