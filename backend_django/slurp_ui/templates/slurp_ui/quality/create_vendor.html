{% extends "slurp_ui/base_module.html" %}
{% block title %}Add Vendor — SLURP{% endblock %}
{% block module_title %}Add Vendor{% endblock %}
{% block header_actions %}
  <a href="{% url 'slurp_ui:quality' %}" class="hs-btn">All vendors</a>
{% endblock %}
{% block main %}
<div class="hs-bleed" style="padding:1.25rem 1.5rem 2rem">
  <form method="post">
    {% csrf_token %}
    <div class="hs-card" style="margin-bottom:1rem">
      <div class="hs-card-header"><h3>Vendor details</h3></div>
      <div class="hs-card-body">
        <div class="hs-form-grid">
          <div class="form-row">
            <label for="name">Vendor name *</label>
            <input id="name" name="name" required />
          </div>
          <div class="form-row">
            <label for="vendor_id">Vendor ID</label>
            <input id="vendor_id" name="vendor_id" />
          </div>
          <div class="form-row">
            <label for="contact_name">Contact name</label>
            <input id="contact_name" name="contact_name" />
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
          </div>
          <div class="form-row">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" />
          </div>
          <div class="form-row">
            <label for="risk_profile">Risk profile *</label>
            <select id="risk_profile" name="risk_profile">
              {% for val, label in risk_choices %}
              <option value="{{ val }}" {% if val == '2' %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="hs-card" style="margin-bottom:1rem">
      <div class="hs-card-header"><h3>Address</h3></div>
      <div class="hs-card-body">
        <div class="form-row">
          <label for="street_address">Street</label>
          <input id="street_address" name="street_address" />
        </div>
        <div class="hs-form-grid-3">
          <div class="form-row"><label>City</label><input name="city" /></div>
          <div class="form-row"><label>State</label><input name="state" /></div>
          <div class="form-row"><label>ZIP</label><input name="zip_code" /></div>
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label>Country</label>
          <input name="country" value="USA" />
        </div>
      </div>
    </div>

    <div class="hs-card" style="margin-bottom:1rem">
      <div class="hs-card-header"><h3>Notes</h3></div>
      <div class="hs-card-body">
        <div class="form-row" style="margin:0">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="2"></textarea>
        </div>
      </div>
    </div>

    <div class="hs-form-actions">
      <button type="submit" class="hs-btn hs-btn-primary">Create vendor</button>
      <a class="hs-btn" href="{% url 'slurp_ui:quality' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
