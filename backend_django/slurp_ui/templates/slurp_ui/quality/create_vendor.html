{% extends "slurp_ui/base_module.html" %}
{% block title %}Add Vendor — SLURP{% endblock %}
{% block module_title %}Quality{% endblock %}
{% block main %}
<div class="modal-page" style="max-width:820px">
  <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:start;margin-bottom:1rem">
    <h2 style="margin:0">Add New Vendor</h2>
    <a class="btn btn-secondary" href="{% url 'slurp_ui:quality' %}">Back to vendors</a>
  </div>
  <form method="post">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
      <div class="form-row">
        <label for="name">Vendor name *</label>
        <input id="name" name="name" required />
      </div>
      <div class="form-row">
        <label for="vendor_id">Vendor ID</label>
        <input id="vendor_id" name="vendor_id" />
      </div>
      <div class="form-row">
        <label for="contact_name">Contact name</label>
        <input id="contact_name" name="contact_name" />
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
      </div>
      <div class="form-row">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" />
      </div>
      <div class="form-row">
        <label for="risk_profile">Risk profile *</label>
        <select id="risk_profile" name="risk_profile">
          {% for val, label in risk_choices %}
          <option value="{{ val }}" {% if val == '2' %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <h3 style="margin:1rem 0 0.5rem">Address</h3>
    <div class="form-row">
      <label for="street_address">Street</label>
      <input id="street_address" name="street_address" />
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0.5rem">
      <div class="form-row"><label>City</label><input name="city" /></div>
      <div class="form-row"><label>State</label><input name="state" /></div>
      <div class="form-row"><label>ZIP</label><input name="zip_code" /></div>
      <div class="form-row"><label>Country</label><input name="country" value="USA" /></div>
    </div>
    <div class="form-row">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="2"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create vendor</button>
    </div>
  </form>
</div>
{% endblock %}
